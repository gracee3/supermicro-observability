name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MUSL tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Add Rust target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Prepare non-secret Compose environment
        run: |
          cp .env.example .env
          chmod 0600 .env
          scripts/configure-host --non-interactive --apply --quiet \
            --host-label ci \
            --platform-profile generic \
            --disable-nvidia \
            --disable-smart \
            --clear-protected-devices \
            --allow-any-root \
            --disable-fan-metrics
      - name: Validate repository
        run: |
          scripts/validate.sh
      - name: Build static GPU exporter
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path gpu-exporter/Cargo.toml
