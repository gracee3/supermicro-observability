global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 1s
  external_labels:
    host: supermicro

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    scrape_timeout: 2s
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          instance: supermicro

  - job_name: node-fast
    scrape_interval: 1s
    scrape_timeout: 750ms
    params:
      "collect[]":
        - cpu
        - meminfo
        - vmstat
        - pressure
        - diskstats
        - netdev
        - softnet
        - schedstat
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: supermicro
          collector_tier: fast

  - job_name: node-slow
    scrape_interval: 15s
    scrape_timeout: 10s
    params:
      "collect[]":
        - filesystem
        - hwmon
        - thermal_zone
        - edac
        - nvme
        - cpufreq
        - uname
        - textfile
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: supermicro
          collector_tier: slow

  - job_name: gpu-fast
    scrape_interval: 500ms
    scrape_timeout: 250ms
    static_configs:
      - targets: ["127.0.0.1:9836"]
        labels:
          instance: supermicro
          collector_tier: fast

  - job_name: gpu-nvml
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ["127.0.0.1:9835"]
        labels:
          instance: supermicro
          collector_tier: slow

  - job_name: smartctl
    scrape_interval: 5m
    scrape_timeout: 30s
    static_configs:
      - targets: ["127.0.0.1:9633"]
        labels:
          instance: supermicro
          collector_tier: storage

  - job_name: cadvisor
    scrape_interval: 5s
    scrape_timeout: 3s
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/cadvisor.json"]
        refresh_interval: 5s
