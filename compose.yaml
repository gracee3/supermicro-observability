name: supermicro-observability

x-common: &common
  network_mode: host
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: supermicro-node-exporter
    pid: host
    user: "${OBSERVABILITY_UID:-1000}:${OBSERVABILITY_GID:-1000}"
    command:
      - --web.listen-address=127.0.0.1:9100
      - --web.max-requests=8
      - --runtime.gomaxprocs=1
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --path.udev.data=/run/udev/data
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.vmstat
      - --collector.pressure
      - --collector.diskstats
      - --collector.netdev
      - --collector.softnet
      - --collector.schedstat
      - --collector.filesystem
      - --collector.hwmon
      - --collector.thermal_zone
      - --collector.edac
      - --collector.nvme
      - --collector.cpufreq
      - --collector.uname
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.diskstats.device-exclude=${NODE_DISKSTATS_DEVICE_EXCLUDE:-^(ram|loop|fd|sr|zram)[0-9]+$}
      - --collector.netdev.device-exclude=^(lo|docker[0-9]+|veth.*|br-.*)$
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
      - --log.level=warn
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /run/udev/data:/run/udev/data:ro
      - ${TEXTFILE_COLLECTOR_DIR:-./runtime/textfile_collector}:/var/lib/node_exporter/textfile_collector:ro
    mem_limit: 256m
    pids_limit: 128
    cpu_shares: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null 'http://127.0.0.1:9100/metrics?collect%5B%5D=cpu'"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  fast-gpu-exporter:
    <<: *common
    profiles: ["nvidia"]
    image: local/supermicro-gpu-exporter:0.2.0
    build:
      context: ./gpu-exporter
      dockerfile: Dockerfile
    container_name: supermicro-fast-gpu-exporter
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      GPU_EXPORTER_LISTEN_ADDRESS: 127.0.0.1:9836
      GPU_EXPORTER_IDENTITY_MODE: ${GPU_IDENTITY_MODE:-alias}
      GPU_EXPORTER_IDENTITY_SALT: ${GPU_IDENTITY_SALT:?set by configure-host}
    mem_limit: 256m
    pids_limit: 64
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/supermicro-gpu-exporter", "--check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    <<: *common
    image: prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
    container_name: supermicro-prometheus
    user: "${OBSERVABILITY_UID:-1000}:${OBSERVABILITY_GID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=12GB
      - --storage.tsdb.wal-compression
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
      - --query.max-concurrency=8
      - --log.level=warn
    volumes:
      - ./runtime/prometheus:/etc/prometheus:ro
      - ./data/prometheus:/prometheus
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 2g
    pids_limit: 256
    cpu_shares: 128
    blkio_config:
      weight: 100
    depends_on:
      node-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  grafana:
    <<: *common
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: supermicro-grafana
    user: "${OBSERVABILITY_UID:-1000}:${OBSERVABILITY_GID:-1000}"
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 500ms
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/live-overview.json
      GF_METRICS_ENABLED: "true"
      GF_LOG_LEVEL: warn
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    pids_limit: 256
    cpu_shares: 128
    blkio_config:
      weight: 100
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  nvml-exporter:
    <<: *common
    profiles: ["nvidia"]
    image: utkuozdemir/nvidia_gpu_exporter:1.14.0-nvml@sha256:82acc3fc60a5a709846ea9757bbccb170fd141039fa47e5899c55fe9a60f56fe
    container_name: supermicro-nvml-exporter
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      GOMAXPROCS: "1"
      GOMEMLIMIT: 256MiB
    command:
      - --web.listen-address=127.0.0.1:9835
      - --web.max-requests=4
      - --collect.backend=nvml
      - --collect.interval=15s
      - --collect.timeout=10s
      - --no-collect.compute-apps
      - --no-collect.pcie-throughput
      - --no-shutdown-on-error
      - --log.level=warn
    mem_limit: 384m
    pids_limit: 128
    cpu_shares: 128
    healthcheck:
      test: ["CMD", "/usr/bin/nvidia_gpu_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  smartctl-exporter:
    <<: *common
    profiles: ["smart"]
    image: prometheuscommunity/smartctl-exporter:v0.14.0@sha256:cfe22c36d7d2fac48ebf619707305acb65eb0fb670656eb80f356e606d782bc1
    container_name: supermicro-smartctl-exporter
    user: "0:0"
    cap_add:
      - SYS_ADMIN
    devices:
      - ${SMART_DEVICE_HOST:-/dev/null}:/dev/smart-target:r
    command:
      - --web.listen-address=127.0.0.1:9633
      - --smartctl.interval=5m
      - --smartctl.rescan=0s
      - --no-smartctl.scan
      - --smartctl.device=/dev/smart-target;${SMART_DEVICE_TYPE:-auto}
      - --log.level=warn
    mem_limit: 256m
    pids_limit: 64
    cpu_shares: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:9633/metrics"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  cadvisor:
    <<: *common
    profiles: ["containers"]
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    container_name: supermicro-cadvisor
    privileged: false
    cap_add:
      - SYS_ADMIN
    command:
      - --listen_ip=127.0.0.1
      - --port=8080
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=
      - --housekeeping_interval=5s
      - --max_housekeeping_interval=5s
      - --allow_dynamic_housekeeping=false
      - --global_housekeeping_interval=1m
      - --enable_load_reader=false
      - --disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,disk,hugetlb,memory_numa,oom_event,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
      - --event_storage_event_limit=default=0
      - --event_storage_age_limit=default=0s
      - --storage_duration=1m
      - --max_procs=1
      - --v=0
    volumes:
      - /:/rootfs:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run:/run:ro
    tmpfs:
      - /var/lib/cadvisor:size=32m,mode=0755
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    pids_limit: 256
    cpu_shares: 64
